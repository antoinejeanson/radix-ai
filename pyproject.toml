[project]
name = "radix-ai"
version = "0.1.0"
description = "Modular AI agent for small, memory-limited LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.54",
    "prompt-toolkit>=3.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
