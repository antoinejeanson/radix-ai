[project]
name = "radix-ai"
version = "0.1.0"
description = "Modular AI agent for small, memory-limited LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coverage>=7.16.0",
    "openai>=1.54",
    "prompt-toolkit>=3.0",
    "pytest-cov>=7.1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Default rules: E (pycodestyle errors), F (pyflakes), I (isort), W (pycodestyle warnings)
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
